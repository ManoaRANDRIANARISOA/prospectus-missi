<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" role="img" aria-label="Kanana Camp">
  <!-- Camp / Safari Emblem -->
  <g transform="translate(4, 4)">
    <!-- Circular outline border with luxury double ring -->
    <circle cx="28" cy="28" r="26" stroke="#FFFFFF" stroke-width="1.4" opacity="0.4" stroke-dasharray="2 3"/>
    <circle cx="28" cy="28" r="23" stroke="#FFFFFF" stroke-width="1.8"/>
    
    <!-- Safari Tent / Nature Camp Structure -->
    <path d="M28 12 L15 36 L41 36 Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M28 12 L28 36" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M24 36 L28 26 L32 36" stroke="#FFFFFF" stroke-width="1.4" fill="#FFFFFF" fill-opacity="0.2"/>
    
    <!-- Lake Water Ripples -->
    <path d="M12 40 C18 38, 22 42, 28 40 C34 38, 38 42, 44 40" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M16 44 C20 43, 24 45, 28 44 C32 43, 36 45, 40 44" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Pine tree silhouette beside tent -->
    <path d="M14 26 L11 31 L13 31 L9 36 L19 36 L15 31 L17 31 Z" fill="#FFFFFF"/>
    <!-- Small star / sun in sky -->
    <circle cx="38" cy="18" r="2" fill="#FFFFFF"/>
  </g>
  
  <!-- Typography -->
  <text x="68" y="30" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">KANANA CAMP</text>
  <text x="69" y="44" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#FFFFFF" opacity="0.75">LODGE &amp; NATURE · MANTASOA</text>
</svg>